name: Download count

# 랜딩 페이지가 표시할 누적 다운로드 수를 하루 한 번 갱신한다.
# 방문자 브라우저에서 GitHub API를 직접 부르면 외부 요청·추적 금지(RELEASING.md §5)에
# 걸리고 미인증 레이트리밋(60회/시)에도 막히므로, 여기서 미리 계산해 docs/downloads.json으로
# 커밋한다 — Pages가 같은 오리진에서 그 파일을 서빙한다.

on:
  schedule:
    # 매일 03:17 UTC. 정시를 피해 러너 혼잡 시간대를 비켜 둔다.
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: download-count
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Collect download counts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/collect-downloads.sh

      - name: Commit when the count changed
        run: |
          if git diff --quiet -- docs/downloads.json; then
            echo "다운로드 수가 그대로입니다 — 커밋하지 않습니다."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/downloads.json
          # [skip ci]로 CI를 건너뛴다. 숫자 한 줄 때문에 macOS 러너에서 전체
          # 빌드·테스트를 매일 돌릴 이유가 없다.
          git commit -m "랜딩 다운로드 수 갱신 [skip ci]"
          git push

name: 기능 제안
description: 새 기능이나 개선 아이디어. (특정 앱 지원은 "앱 지원 요청" 템플릿을 써 주세요.)
title: "[제안] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        제안 감사합니다. 방향을 맞추기 위해 먼저 읽어 주세요.

        - Mackor은 **특정 앱 이름을 코드에 넣지 않습니다.** 개선은 항상 "AX 없음 + 합성 입력 수용" 같은 **공통 조건**으로 들어갑니다. 배경은 [CONTRIBUTING.md](../blob/main/CONTRIBUTING.md)에 있습니다.
        - 입력 교정은 **로컬·무네트워크·규칙 기반**을 원칙으로 합니다(외부 AI/API/구독 없음). 이 경계를 넘는 제안은 취지를 함께 적어 주세요.
        - 세벌식·사용자 정의 자판·다른 언어 입력기는 현재 범위 밖입니다.
  - type: textarea
    id: problem
    attributes:
      label: 어떤 문제를 풀고 싶은가요
      description: 기능 자체보다 "무엇이 불편한지"를 먼저 적어 주세요.
      placeholder: "예: 교정된 걸 되돌리고 싶은데 6초가 짧아서 놓칩니다."
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: 생각하는 방식 (선택)
      description: 구체적인 안이 있으면. 없으면 비워도 됩니다.
  - type: textarea
    id: alternatives
    attributes:
      label: 지금은 어떻게 하고 있나요 (선택)
      description: 대안이나 우회 방법이 있다면.

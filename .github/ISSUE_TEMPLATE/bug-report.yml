name: 버그 신고
description: 앱이 잘못 동작하거나, 오교정·크래시·권한 문제가 있을 때. (특정 앱에서 자판자동이 안 되는 문제는 "앱 지원 요청" 템플릿을 써 주세요.)
title: "[버그] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        **먼저 확인해 주세요.** 아래는 버그가 아니라 알려진 동작입니다.

        - 특정 앱(한컴·Illustrator 등)에서 자판자동이 안 됨 → "앱 지원 요청" 템플릿으로 옮겨 주세요.
        - 앱을 방금 전환하고 친 **첫 단어**가 안 고쳐짐 → 알려진 한계, 다음 단어부터 정상입니다.
        - 소문자 약어(`sms`·`dhcp`)가 한글로 바뀜 → [README 「알려진 한계」](../blob/main/README.md#알려진-한계-먼저-읽어-주세요) 참고, ⌘Z로 복구됩니다.
        - 비밀번호·주소창·보안 입력란에서 동작 안 함 → **의도적으로** 제외한 것입니다.

        > 입력한 실제 글자, 파일 경로, 사용자 이름 같은 개인정보는 이 이슈에 넣지 마세요. 재현에는 아래 정보만 있으면 됩니다.
  - type: textarea
    id: what-happened
    attributes:
      label: 무슨 일이 있었나요
      description: 무엇을 기대했고 실제로 무엇이 일어났는지 적어 주세요.
      placeholder: "예: 한글로 '안녕'을 쳤는데 영어로 바뀌었습니다. / 손쉬운 사용을 끄니 전체 입력이 멈췄습니다."
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 재현 순서
      description: 가능하면 처음부터 순서대로. 어떤 앱, 어떤 입력 소스(한/영), 어떤 단어인지.
      placeholder: |
        1. TextEdit에서 한국어 두벌식으로 전환
        2. 'dkssud' 입력 후 Space
        3. ...
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: 환경
      placeholder: "예: Mackor 1.3 (빌드 9), macOS 14.5, Apple Silicon"
    validations:
      required: true
  - type: dropdown
    id: scope
    attributes:
      label: 자동 교정 적용 범위
      options:
        - "앱을 가리지 않고 적용"
        - "선택한 앱만"
        - "모르겠음"
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: 그 밖에 (선택)
      description: 크래시라면 `Console.app`의 관련 로그나 스크린샷을 붙여 주세요. 개인정보는 가려 주세요.
